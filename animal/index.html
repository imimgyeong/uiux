<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--라이브러리파일-->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">
    <!--내가만든파일-->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/main.js"></script>
    <title>유기동물 보호소</title>
</head>
<body>
    <div id="wrap">
        <header></header>
        <div class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2>
                <div class="swiper"> <!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                    <ul class="swiper-wrapper"> <!-- 각 팝업 콘텐츠를 감싸는 요소-->
                        <li class="swiper-slide popup1">
                            <div class="wrapper">
                                <p>주인을 기다리는 마음, <br>주인을 찾는 마음</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup2">
                            <div class="wrapper">
                                <p>잃어버린 가족, <br>다시 만날 수 있도록</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup3">
                            <div class="wrapper">
                                <p>발견, 보호, 입양, <br>그리고 행복까지</p>
                            </div>
                        </li>
                    </ul>
                </div><!--/swiper-->
                <div class="ctrl_btn">
                    <div class="paging">
                        <div class="current">현재팝업번호</div>
                        <div class="bar"><span></span></div>
                        <div class="total">전체팝업번호</div>
                    </div>
                    <button class="stop">
                        <span class="blind">일시정지</span>
                        <i>
                            <svg viewBox="0 0 8 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6.66667 9.66683C6.3 9.66683 5.98611 9.53627 5.725 9.27516C5.46389 9.01405 5.33333 8.70016 5.33333 8.3335V1.66683C5.33333 1.30016 5.46389 0.986274 5.725 0.725163C5.98611 0.464052 6.3 0.333496 6.66667 0.333496C7.03333 0.333496 7.34722 0.464052 7.60833 0.725163C7.86944 0.986274 8 1.30016 8 1.66683V8.3335C8 8.70016 7.86944 9.01405 7.60833 9.27516C7.34722 9.53627 7.03333 9.66683 6.66667 9.66683ZM1.33333 9.66683C0.966667 9.66683 0.652778 9.53627 0.391667 9.27516C0.130556 9.01405 0 8.70016 0 8.3335V1.66683C0 1.30016 0.130556 0.986274 0.391667 0.725163C0.652778 0.464052 0.966667 0.333496 1.33333 0.333496C1.7 0.333496 2.01389 0.464052 2.275 0.725163C2.53611 0.986274 2.66667 1.30016 2.66667 1.66683V8.3335C2.66667 8.70016 2.53611 9.01405 2.275 9.27516C2.01389 9.53627 1.7 9.66683 1.33333 9.66683Z" fill="white"/>
                            </svg>
                                
                        </i>
                    </button>
                    <button class="play">
                        <span class="blind">재생버튼</span>
                        <i>
                            <svg viewBox="0 0 8 10" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6.78325 4.43337C6.88325 4.50003 6.95825 4.58337 7.00825 4.68337C7.05825 4.78337 7.08325 4.88892 7.08325 5.00003C7.08325 5.11114 7.05825 5.2167 7.00825 5.3167C6.95825 5.4167 6.88325 5.50003 6.78325 5.5667L1.34992 9.0167C1.29436 9.05003 1.23603 9.07503 1.17492 9.0917C1.11381 9.10837 1.05547 9.1167 0.999918 9.1167C0.822141 9.1167 0.666585 9.05281 0.533252 8.92503C0.399919 8.79725 0.333252 8.63892 0.333252 8.45003L0.333253 1.55003C0.333253 1.36114 0.399919 1.20281 0.533252 1.07503C0.666586 0.947254 0.822141 0.883365 0.999919 0.883365C1.05547 0.883365 1.11381 0.891698 1.17492 0.908365C1.23603 0.925032 1.29436 0.950032 1.34992 0.983366L6.78325 4.43337Z" fill="white"/>
                            </svg>
                                
                        </i>
                    </button>
                </div><!--/ctrl_btn-->
            </section><!--/visual-->
            <section class="find"></section><!--/find-->
            <section class="slogan"></section><!--/slogan-->
            <section class="adopt"></section><!--/adopt-->
            <section class="review"></section><!--/review-->
        </div><!--/container-->
        <footer></footer>
    </div>
</body>
</html>
