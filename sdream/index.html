<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--외부 라이브러리 파일 상단에 위치-->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="css/swiper-bundle.min.css">

    <!--내가 직접 코딩하는 하단-->
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>삼성꿈장학재단</title>
</head>
<body>
    <div class="wh"></div>
    <div id="wrap">
        <header></header>
        <main class="container">
            <section class="visual">
                <h2 class="blind">팝업</h2>
                <div class="swiper"> <!-- 팝업의 높이와 넓이를 css에서 줄 수 있는 요소-->
                    <ul class="swiper-wrapper"> <!-- 각 팝업 콘텐츠를 감싸는 요소-->
                        <li class="swiper-slide popup1">
                            <div class="wrapper">
                                <h2>아이들의 작은 꿈이 모여<br class="pc_only">우리 모두의 미래가 됩니다</h2>
                                <p>배움과 나눔으로 희망을 키우는 삼성꿈장학재단</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup2">
                            <div class="wrapper">
                                <h2>배움의 기회를 넓히고<br class="pc_only">꿈꾸는 아이들의 미래를 지킵니다</h2>
                                <p>사랑과 관심으로 함께하는 삼성꿈장학재단</p>
                            </div>
                        </li>
                        <li class="swiper-slide popup3">
                            <div class="wrapper">
                                <h2>사람을 키우는 교육의 힘이<br class="pc_only">세상을 바꾸는 내일을 만듭니다</h2>
                                <p>아이들의 꿈을 지켜주는 든든한 동행</p>
                            </div>
                        </li>
                    </ul>
                </div><!--/swiper-->
            </section><!--/visual-->
            <section class="biz">

            </section><!--/biz-->
            <section class="notice">

            </section><!--/notice-->
            <section class="webzine">

            </section><!--/webzine-->
            <section class="service">

            </section><!--/service-->
        </main>
        <footer></footer>
    </div>
</body>
</html>
